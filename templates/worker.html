<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>FairShift – Worker / தொழிலாளர்</title>
  <!-- Bootstrap 5 (CDN – no local install needed) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    /* ── Mobile-first base ──────────────────────────────── */
    :root {
      --clk-green: #198754;
      --clk-red:   #dc3545;
      --warn-amber:#ffc107;
    }
    *:focus {
      outline: 3px solid #0d6efd !important;
      outline-offset: 2px;
    }
    body {
      font-size: 1.05rem;
      background: #f8f9fa;
      padding-bottom: 2rem;
    }

    /* Large touch targets for low-end phones */
    .btn-clock {
      width: 100%;
      padding: 1rem;
      font-size: 1.25rem;
      font-weight: 600;
      border-radius: 0.75rem;
      margin-bottom: 0.75rem;
    }

    /* Status badge */
    #status-badge {
      font-size: 1rem;
      padding: 0.5rem 1rem;
      border-radius: 2rem;
    }

    /* Section cards */
    .section-card {
      border-radius: 1rem;
      border: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 1.25rem;
    }
    .section-card .card-header {
      font-weight: 700;
      font-size: 1.1rem;
      border-radius: 1rem 1rem 0 0;
    }

    /* Severity colour chips */
    .sev-low    { background: #d1e7dd; color: #0f5132; }
    .sev-medium { background: #fff3cd; color: #664d03; }
    .sev-high   { background: #f8d7da; color: #842029; }

    /* Mic button pulse animation */
    .mic-active {
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(220,53,69,0.5); }
      70%  { box-shadow: 0 0 0 12px rgba(220,53,69,0); }
      100% { box-shadow: 0 0 0 0 rgba(220,53,69,0); }
    }
  </style>
</head>
<body>

<!-- ═══════════════ NAVBAR ═══════════════ -->
<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand fw-bold">⚙️ FairShift</span>
  <a href="/admin" class="btn btn-outline-light btn-sm">Admin</a>
</nav>

<div class="container mt-3" style="max-width: 480px;">

  <!-- ═══════════════ WORKER SELECTOR ═══════════════ -->
  <div class="card section-card">
    <div class="card-header bg-dark text-white">
      👤 Select Worker / தொழிலாளரைத் தேர்ந்தெடு
    </div>
    <div class="card-body">
      <label for="worker-select" class="form-label visually-hidden">
        Select Worker / தொழிலாளரைத் தேர்ந்தெடு
      </label>
      <select id="worker-select" class="form-select form-select-lg" aria-label="Select Worker / தொழிலாளரைத் தேர்ந்தெடு">
        <option value="">-- Choose / தேர்வு --</option>
      </select>
    </div>
  </div>

  <!-- ═══════════════ SHIFT TRACKING ═══════════════ -->
  <div class="card section-card">
    <div class="card-header bg-success text-white">
      🕐 Shift Tracking / ஷிஃப்ட் கண்காணிப்பு
    </div>
    <div class="card-body text-center">
      <div id="shift-status" class="mb-3">
        <span id="status-badge" class="badge bg-secondary">
          Select a worker / தொழிலாளரைத் தேர்வு செய்க
        </span>
      </div>
      <button
        id="btn-clock-in"
        class="btn btn-success btn-clock"
        onclick="clockIn()"
        disabled
        aria-label="Clock In / உள்நுழை"
      >
        ✅ Clock In / உள்நுழை
      </button>
      <button
        id="btn-clock-out"
        class="btn btn-danger btn-clock"
        onclick="clockOut()"
        disabled
        aria-label="Clock Out / வெளியேறு"
      >
        🛑 Clock Out / வெளியேறு
      </button>
      <div id="clock-feedback" class="mt-2" role="status" aria-live="polite"></div>
    </div>
  </div>

  <!-- ═══════════════ SAFETY REPORT ═══════════════ -->
  <div class="card section-card">
    <div class="card-header bg-danger text-white">
      🚨 Report Hazard (Anonymous) / ஆபத்தைப் புகாரளி (அநாமதேய)
    </div>
    <div class="card-body">
      <form id="hazard-form" onsubmit="submitHazard(event)">
        <!-- Industry -->
        <label for="hz-industry" class="form-label fw-semibold">
          Industry / தொழில்துறை
        </label>
        <select id="hz-industry" class="form-select mb-3" required>
          <option value="campus">🏫 Campus Staff / வளாக ஊழியர்</option>
          <option value="construction">🏗️ Construction / கட்டுமானம்</option>
        </select>

        <!-- Location -->
        <label for="hz-location" class="form-label fw-semibold">
          Location / இடம்
        </label>
        <input
          id="hz-location"
          type="text"
          class="form-control mb-3"
          placeholder="e.g. Block B / தொகுதி B"
        />

        <!-- Description with Speech API -->
        <label for="hz-description" class="form-label fw-semibold">
          Description / விவரம்
          <small class="text-muted">(or use mic / மைக் பயன்படுத்தவும்)</small>
        </label>
        <div class="input-group mb-3">
          <textarea
            id="hz-description"
            class="form-control"
            rows="3"
            placeholder="Describe the hazard… / ஆபத்தை விவரிக்கவும்…"
            required
          ></textarea>
          <button
            type="button"
            id="btn-mic"
            class="btn btn-outline-danger"
            onclick="toggleSpeech()"
            title="Speak / பேசவும்"
            aria-label="Speak hazard description / ஆபத்தை பேசவும்"
          >
            🎤
          </button>
        </div>

        <!-- Severity -->
        <label class="form-label fw-semibold">
          Severity / தீவிரம்
        </label>
        <div class="d-flex gap-2 mb-3">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="severity" id="sev-low" value="low" />
            <label class="form-check-label sev-low px-2 rounded" for="sev-low">
              Low / குறைவு
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="severity" id="sev-med" value="medium" checked />
            <label class="form-check-label sev-medium px-2 rounded" for="sev-med">
              Medium / நடுத்தரம்
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="severity" id="sev-high" value="high" />
            <label class="form-check-label sev-high px-2 rounded" for="sev-high">
              High / அதிகம்
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-danger btn-clock">
          🚨 Submit Report / புகாரைச் சமர்ப்பி
        </button>
      </form>
      <div id="hazard-feedback" class="mt-2" role="status" aria-live="polite"></div>
    </div>
  </div>

</div><!-- /container -->

<!-- ═══════════════ SCRIPTS ═══════════════ -->
<script>
  // ── State ──
  let selectedWorker = null;
  let recognition = null;
  let isListening = false;

  // ── On Load: populate worker dropdown ──
  document.addEventListener("DOMContentLoaded", () => {
    fetch("/api/workers")
      .then((r) => r.json())
      .then((workers) => {
        const sel = document.getElementById("worker-select");
        workers.forEach((w) => {
          const opt = document.createElement("option");
          opt.value = w.id;
          const label =
            w.industry === "campus" ? "🏫" : "🏗️";
          opt.textContent = `${label} ${w.name}`;
          sel.appendChild(opt);
        });
      });
  });

  // ── Worker selection change ──
  document.getElementById("worker-select").addEventListener("change", (e) => {
    const wid = parseInt(e.target.value);
    if (!wid) {
      selectedWorker = null;
      updateShiftUI(false);
      return;
    }
    selectedWorker = wid;
    refreshShiftStatus();
  });

  /** Fetch current shift status and update buttons. */
  function refreshShiftStatus() {
    if (!selectedWorker) return;
    fetch(`/api/shift-status/${selectedWorker}`)
      .then((r) => r.json())
      .then((data) => updateShiftUI(data.clocked_in, data.clock_in));
  }

  /** Toggle button visibility based on clock-in state. */
  function updateShiftUI(clockedIn, clockInTime) {
    const badge = document.getElementById("status-badge");
    const btnIn = document.getElementById("btn-clock-in");
    const btnOut = document.getElementById("btn-clock-out");

    if (!selectedWorker) {
      badge.className = "badge bg-secondary";
      badge.textContent = "Select a worker / தொழிலாளரைத் தேர்வு செய்க";
      btnIn.disabled = true;
      btnOut.disabled = true;
      return;
    }

    if (clockedIn) {
      const t = new Date(clockInTime).toLocaleTimeString();
      badge.className = "badge bg-success";
      badge.textContent = `✅ Clocked in since ${t} / ${t} முதல் உள்நுழைந்துள்ளார்`;
      btnIn.disabled = true;
      btnOut.disabled = false;
    } else {
      badge.className = "badge bg-warning text-dark";
      badge.textContent = "⏸ Not clocked in / உள்நுழையவில்லை";
      btnIn.disabled = false;
      btnOut.disabled = true;
    }
  }

  // ── Clock In ──
  function clockIn() {
    if (!selectedWorker) return;
    fetch("/api/clock-in", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ worker_id: selectedWorker }),
    })
      .then((r) => r.json())
      .then((data) => {
        showFeedback("clock-feedback", data.message || data.error, !data.error);
        refreshShiftStatus();
      });
  }

  // ── Clock Out ──
  function clockOut() {
    if (!selectedWorker) return;
    fetch("/api/clock-out", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ worker_id: selectedWorker }),
    })
      .then((r) => r.json())
      .then((data) => {
        showFeedback("clock-feedback", data.message || data.error, !data.error);
        refreshShiftStatus();
      });
  }

  // ── Submit Hazard Report ──
  function submitHazard(e) {
    e.preventDefault();
    const severity =
      document.querySelector('input[name="severity"]:checked')?.value || "medium";

    const payload = {
      industry: document.getElementById("hz-industry").value,
      location: document.getElementById("hz-location").value,
      description: document.getElementById("hz-description").value,
      severity: severity,
    };

    fetch("/api/hazard-report", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    })
      .then((r) => r.json())
      .then((data) => {
        showFeedback("hazard-feedback", data.message || data.error, !data.error);
        if (!data.error) document.getElementById("hazard-form").reset();
      });
  }

  // ── Web Speech API (voice-to-text for hazard description) ──
  function toggleSpeech() {
    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Speech recognition is not supported on this browser.");
      return;
    }

    const btn = document.getElementById("btn-mic");
    if (isListening && recognition) {
      recognition.stop();
      return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = "ta-IN"; // Tamil – switchable to "en-IN"
    recognition.interimResults = false;
    recognition.continuous = false;

    recognition.onstart = () => {
      isListening = true;
      btn.classList.add("mic-active");
      btn.textContent = "⏹️";
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      document.getElementById("hz-description").value += transcript + " ";
    };

    recognition.onend = () => {
      isListening = false;
      btn.classList.remove("mic-active");
      btn.textContent = "🎤";
    };

    recognition.onerror = (event) => {
      console.error("Speech error:", event.error);
      isListening = false;
      btn.classList.remove("mic-active");
      btn.textContent = "🎤";
    };

    recognition.start();
  }

  // ── HTML escaper (prevent XSS from reflected data) ──
  function esc(str) {
    const el = document.createElement("span");
    el.textContent = str || "";
    return el.innerHTML;
  }

  // ── Feedback toast helper ──
  function showFeedback(elementId, message, success) {
    const el = document.getElementById(elementId);
    el.innerHTML = `
      <div class="alert ${success ? "alert-success" : "alert-danger"} py-2 mb-0" role="alert">
        ${success ? "✅" : "⚠️"} ${esc(message)}
      </div>`;
    setTimeout(() => (el.innerHTML = ""), 4000);
  }
</script>

</body>
</html>
